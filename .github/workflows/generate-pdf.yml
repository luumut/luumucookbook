name: Generate Cookbook PDF

permissions:
  contents: write

concurrency:
  group: cookbook-release
  cancel-in-progress: false

on:
  push:
    branches:
      - master

jobs:
  build-cookbook:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install Typst
      uses: typst-community/setup-typst@v4
      with:
        typst-version: "0.14.2"

    - name: Make script executable
      run: chmod +x ./generate-pdf.sh

    - name: Run cookbook builder
      run: ./generate-pdf.sh

    - name: Upload PDF
      uses: actions/upload-artifact@v4
      with:
        name: cookbook
        path: cookbook.pdf

    - name: Replace cookbook release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail

        release_id=$(gh api --paginate \
          "repos/$GH_REPO/releases" \
          --jq '.[] | select(.tag_name == "cookbook-latest") | .id')

        if [ -n "$release_id" ]; then
          gh release delete cookbook-latest --yes --cleanup-tag
        fi

        gh release create cookbook-latest cookbook.pdf \
          --target "$GITHUB_SHA" \
          --title "Cookbook latest" \
          --notes "Cookbook PDF built from commit $GITHUB_SHA." \
          --latest